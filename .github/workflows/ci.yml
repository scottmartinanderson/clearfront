name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  # Dependencies resolve forward on every install, so the published package can
  # break with no commit behind it. mcp 2.0.0 did exactly that on 2026-07-28 and
  # went unnoticed for two days because nothing pushed. This run needs no author.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,web,dev]"

      - name: Lint (ruff)
        # Matches the repo's enforced gate: pyflakes (F) + runtime-error (E9) rules.
        # Import-order (I001) is known cosmetic debt and is intentionally not gated.
        run: ruff check --select F,E9 .

      - name: Test
        # The test suite is self-contained (no network, no external OSINT binaries).
        # The pytest-freezegun plugin is broken on 3.12, so it is disabled here.
        run: pytest -q -p no:freezegun
